name: Jekyll PR Preview

# Grant the workflow explicit write permission so it can push to branches
permissions:
  contents: write

on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches: [main]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.1'

      - name: Install dependencies
        run: |
          gem install bundler
          bundle config set --local path vendor/bundle
          bundle install --jobs 4 --retry 3

      - name: Build site
        run: bundle exec jekyll build --destination _site

      - name: Add CNAME for previews
        run: echo "previews.theotterway.club" > _site/CNAME

      - name: Deploy to gh-pages (preview)
        uses: peaceiris/actions-gh-pages@v3
        with:
          # Use the PAT stored in GH_PAGES_PAT as `personal_token` so the action
          # authenticates as your user instead of github-actions[bot].
          personal_token: ${{ secrets.GH_PAGES_PAT }}
          publish_dir: ./_site
          publish_branch: gh-pages
          keep_files: true
